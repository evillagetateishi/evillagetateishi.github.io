name: check

# 公開リポジトリなので、秘密情報の混入と生成物のズレを push のたびに機械で見る。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: 秘密情報スキャン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全履歴を見る（過去のコミットに残った秘密も拾うため）
      - name: gitleaks を取得
        run: |
          set -eu
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
      - name: 全履歴スキャン
        run: ./gitleaks git . --redact --verbose --exit-code 1

  validate:
    name: データと生成物の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: スキーマ・禁止パターン・構造化データ・hreflang
        run: python scripts/validate.py

  generated:
    name: 生成一致（rooms.json から作り直して差分ゼロ）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成し直す
        run: python scripts/generate.py
      - name: コミット済みの生成物と一致すること
        # HTML を手で直すとここで止まる。直すのは data/ templates/ scripts/ だけ。
        run: git diff --exit-code -- index.html ja.html sitemap.xml robots.txt rooms
      - name: 生成対象外のページが残っていないこと
        run: git status --porcelain -- rooms | tee /dev/stderr | test ! -s /dev/stdin

  guard:
    name: 触ってはいけないファイルの保全
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GSC 所有権確認ファイルが存在すること
        # Search Console の所有権はこのファイルで確認されている。
        # 生成・検査の対象外であり、削除・移動してはならない。
        run: |
          set -eu
          test -f google2bb9730f466ce625.html
          echo "OK: google2bb9730f466ce625.html は保全されている"
